# FitCrew config.yaml 模板
# install.sh 会把占位符替换后写入 profile 的 config.yaml。
# ⚠️ 这是 YAML，手工编辑务必保证语法正确——写坏会导致 Hermes 静默回退默认配置。

model:
  provider: custom
  default: bodyos-codex
  base_url: __BODYOS_MODEL_BASE_URL__
  api_key: ${BODYOS_MODEL_PROXY_TOKEN}

terminal:
  backend: local
  cwd: .
  timeout: 180

platforms:
  feishu:
    # BodyOS owns user-facing availability wording; never expose Hermes restart diagnostics.
    gateway_restart_notification: false
    extra:
      default_group_policy: allowlist
      # 每加入一个群，install/add-group 会在这里追加一条规则；也可由 Moticlaw 正常流程写入。
      group_rules: {}
        # oc_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx:
        #   policy: open  # Only listed chat ids reach this rule.
        #   require_mention: false   # 打卡群建议 false（主动参与）；大群可 true（仅 @ 时回应）

compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  protect_first_n: 3

memory:
  memory_enabled: true
  user_profile_enabled: true

plugins:
  enabled:
    - bodyos_guard

group_sessions_per_user: true

agent:
  max_turns: 90
  reasoning_effort: medium
